<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar · pre-token launch board</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="radar-mark" aria-hidden="true"><span class="sweep"></span></div>
    <div class="brand-text">
      <h1>Token Radar</h1>
      <p class="tagline">launch radar for protocols that record no token yet</p>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <section class="toolbar">
    <label class="search">
      <span class="visually-hidden">Search protocols</span>
      <input id="search" type="search" placeholder="Search name, slug or category…" autocomplete="off">
    </label>
    <label class="field">
      <span class="visually-hidden">Category</span>
      <select id="category"></select>
    </label>
    <label class="field">
      <span class="visually-hidden">Scope</span>
      <select id="scope">
        <option value="all">All pre-token</option>
        <option value="watchlist">Watchlist</option>
        <option value="early">Early (below floor)</option>
      </select>
    </label>
    <button class="export" id="export" type="button" aria-label="Export the visible rows as a CSV file">Export CSV</button>
    <span class="count" id="count"></span>
  </section>

  <section class="board-wrap">
    <table class="board" id="board">
      <thead>
        <tr>
          <th data-key="rank" class="num">#</th>
          <th data-key="name">Protocol</th>
          <th data-key="implied" class="num">Implied value</th>
          <th data-key="tvl" class="num">TVL</th>
          <th data-key="change" class="num">7d</th>
          <th data-key="age" class="num">Age</th>
          <th data-key="chains" class="num">Chains</th>
          <th class="badge-col"><span class="visually-hidden">Status</span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <section class="live" id="live">
    <h2>Already traded — shown for contrast, never ranked</h2>
    <table class="live-table">
      <thead>
        <tr><th class="num">#</th><th>Protocol</th><th class="num">TVL</th><th class="num">Mkt cap</th><th class="num">7d</th></tr>
      </thead>
      <tbody id="live-rows"></tbody>
    </table>
  </section>

  <footer class="foot">
    <p id="foot-note"></p>
  </footer>
</main>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Protocol detail"></aside>

<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
